    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);

  .row{display:flex; gap:12px;} .row > div{flex:1;}

  button:hover{background:var(--gold);}
  button.secondary{background:transparent; border:1px solid var(--line); color:var(--text-dim); font-weight:400;}
  button.secondary:hover{border-color:var(--gold-dim); color:var(--gold);}

// Storage adapter: pakai window.storage kalau tersedia (di dalam Claude),
// fallback ke IndexedDB kalau file ini dibuka langsung di browser HP/desktop.
const IDB_NAME = 'script_assembler_local';
const IDB_STORE = 'kv';
let idbInstance = null;

function openIdb(){
  return new Promise((resolve, reject) => {
    if(idbInstance){ resolve(idbInstance); return; }
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB tidak didukung')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => { idbInstance = req.result; resolve(idbInstance); };
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const database = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = database.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value){
  const database = await openIdb();
  return new Promise((resolve, reject) => {
    const tx = database.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
const hasClaudeStorage = () => typeof window.storage !== 'undefined' && window.storage !== null;
const storageAdapter = {
  async get(key){
    if(hasClaudeStorage()){
      try{ const res = await window.storage.get(key, false); return res ? res.value : null; }catch(e){}
    }
    try{ return await idbGet(key); }catch(e){ return null; }
  },
  async set(key, value){
    if(hasClaudeStorage()){
      try{ await window.storage.set(key, value, false); return; }catch(e){}
    }
    try{ await idbSet(key, value); }catch(e){ console.error('Gagal menyimpan lokal', e); }
  }
};

function migrateSchema(){
  // Bikin tabel script_log kalau database yang dimuat belum punya (upload lama, dsb)
  try{
    db.run(`CREATE TABLE IF NOT EXISTS script_log (
      id INTEGER PRIMARY KEY AUTOINCREMENT, fase_key TEXT, signature TEXT,
      script_text TEXT, created_at TEXT
    )`);
    db.run(`CREATE TABLE IF NOT EXISTS custom_flows (
      fase_key TEXT PRIMARY KEY, fase_label TEXT NOT NULL,
      level_emosi_min INTEGER NOT NULL, level_emosi_max INTEGER NOT NULL,
      urutan_json TEXT NOT NULL, created_at TEXT
    )`);
  }catch(e){ console.error('Migrasi gagal', e); }
}

async function initEngine(){
  const modeEl = document.getElementById('storage-mode');
  if(modeEl){
    modeEl.textContent = hasClaudeStorage()
      ? 'Penyimpanan: otomatis tersinkron di Claude'
      : 'Penyimpanan: lokal di browser ini (mode mandiri)';
  }
  SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  document.getElementById('setup-loading').style.display = 'none';

  const saved = await tryLoadFromStorage();
  if(saved){
    db = saved;
    migrateSchema();
    showApp();
    return;
  }
  document.getElementById('setup-ready').style.display = 'block';
}

async function tryLoadFromStorage(){
  try{
    const value = await storageAdapter.get('sqlite_db_b64');
    if(!value) return null;
    const bytes = base64ToBytes(value);
    return new SQL.Database(bytes);
  }catch(e){ return null; }
}

async function persist(){
  if(!db) return;
  const bytes = db.export();
  const b64 = bytesToBase64(bytes);
  await storageAdapter.set('sqlite_db_b64', b64);
}

function bytesToBase64(bytes){
  let binary = '';
  const chunk = 8192;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}
function base64ToBytes(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function createEmptyDb(withSeed){
  db = new SQL.Database();
  db.run(SCHEMA_SQL);
  insertFlowsSchema();
  SPECS.forEach(s => db.run("INSERT INTO block_spec VALUES (?,?,?,?)", s));
  if(withSeed){
    SEED_BLOCKS.forEach(row => {
      db.run(`INSERT INTO blocks (id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai)
              VALUES (?,?,?,?,?,?,?,?,?,0)`, row);
    });
  }
  persist();
  showApp();
}

  const buf = await file.arrayBuffer();

};

function showApp(){
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTab('db');
}

function q(sql, params){
  const res = db.exec(sql, params||[]);
  if(res.length===0) return [];
  const cols = res[0].columns;
  return res[0].values.map(row => {
    const obj = {};
    cols.forEach((c,i)=> obj[c]=row[i]);
    return obj;
  });
}

function run(sql, params){
  db.run(sql, params||[]);
  persist();
}

function getFlowDef(key){
  if(FLOWS_DEF[key]) return FLOWS_DEF[key];
  const rows = q("SELECT * FROM custom_flows WHERE fase_key=?", [key]);
  if(rows.length){
    const r = rows[0];
    return [r.fase_label, r.level_emosi_min, r.level_emosi_max, JSON.parse(r.urutan_json)];
  }
  return null;
}

function getCustomFlows(){
  return q("SELECT * FROM custom_flows ORDER BY created_at");
}

let manualFlowBuilder = null;

function syncBuilderInputs(){
  if(!manualFlowBuilder) return;
  const l = document.getElementById('flow-label-input');
  const lo = document.getElementById('flow-lo-input');
  const hi = document.getElementById('flow-hi-input');
  if(l) manualFlowBuilder.label = l.value;
  if(lo) manualFlowBuilder.lo = parseInt(lo.value,10) || manualFlowBuilder.lo;
  if(hi) manualFlowBuilder.hi = parseInt(hi.value,10) || manualFlowBuilder.hi;
}

function flowBuilderAddBlock(key){
  syncBuilderInputs();
  manualFlowBuilder.seq.push(key);
  renderRakit();
}

function flowBuilderRemoveBlock(idx){
  syncBuilderInputs();
  manualFlowBuilder.seq.splice(idx,1);
  renderRakit();
}

function flowBuilderMove(idx, dir){
  syncBuilderInputs();
  const newIdx = idx+dir;
  if(newIdx<0 || newIdx>=manualFlowBuilder.seq.length) return;
  const tmp = manualFlowBuilder.seq[idx];
  manualFlowBuilder.seq[idx] = manualFlowBuilder.seq[newIdx];
  manualFlowBuilder.seq[newIdx] = tmp;
  renderRakit();
}

function saveFlowBuilder(){
  syncBuilderInputs();
  const label = (manualFlowBuilder.label || '').trim();
  if(!label){ alert('Isi nama fase dulu ya.'); return; }
  if(manualFlowBuilder.seq.length === 0){ alert('Tambahkan minimal 1 blok ke urutan fase.'); return; }
  let lo = manualFlowBuilder.lo, hi = manualFlowBuilder.hi;
  if(lo > hi){ const t=lo; lo=hi; hi=t; }
  const slug = 'custom_' + label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) + '_' + Date.now().toString(36);
  run("INSERT INTO custom_flows (fase_key, fase_label, level_emosi_min, level_emosi_max, urutan_json, created_at) VALUES (?,?,?,?,?,?)",
    [slug, label, lo, hi, JSON.stringify(manualFlowBuilder.seq), new Date().toISOString()]);
  currentFase = slug;
  lastAssembled = null;
  manualFlowBuilder = null;
  renderRakit();
}

function deleteCustomFlow(key){
  if(!confirm('Hapus fase manual ini? Blok yang sudah ditulis di database tidak ikut terhapus.')) return;
  run("DELETE FROM custom_flows WHERE fase_key=?", [key]);
  if(currentFase === key){
    currentFase = Object.keys(FLOWS_DEF)[0];
    lastAssembled = null;
  }
  renderRakit();
}

function nextId(blokKey){
  const prefix = BLOKS.find(b=>b.key===blokKey).prefix;
  const rows = q("SELECT COUNT(*) as c FROM blocks WHERE blok=?", [blokKey]);
  const n = (rows[0].c || 0) + 1;
  return prefix + String(n).padStart(3,'0');
}

const VALID_BLOK_KEYS = BLOKS.map(b => b.key);

function importBlocksFromFile(file, statusEl, afterImport){
  if(!file) return;
  statusEl.textContent = 'Membaca file...';
  statusEl.style.color = 'var(--text-dim)';

  const processRows = (rows) => {
    let created = 0, updated = 0, skipped = 0, skipReasons = [];
    rows.forEach((row, i) => {
      const blok = String(row.blok || row.Blok || '').trim().toLowerCase();
      const teks = String(row.teks || row.Teks || '').trim();
      if(!blok || !teks){
        skipped++; skipReasons.push(`Baris ${i+2}: blok atau teks kosong`);
        return;
      }
      if(!VALID_BLOK_KEYS.includes(blok)){
        skipped++; skipReasons.push(`Baris ${i+2}: blok "${blok}" tidak dikenal`);
        return;
      }
      const subtipe = String(row.subtipe || row.Subtipe || '').trim();
      const fase = String(row.fase_cocok || row.Fase_cocok || row.fase || 'Universal').trim() || 'Universal';
      const level = Number(row.level_emosi || row.Level_emosi || 5) || 5;
      const nada = String(row.nada || row.Nada || '').trim();
      const brand = String(row.kosakata_brand || row.Kosakata_brand || '').trim();
      const cocok = String(row.cocok_dipasang_dengan || row.Cocok_dipasang_dengan || '').trim();
      const givenId = String(row.id || row.ID || '').trim();
      const usedRaw = row.sudah_dipakai !== undefined ? row.sudah_dipakai : row.Sudah_dipakai;
      const hasUsedCol = usedRaw !== undefined && String(usedRaw).trim() !== '';
      const usedVal = Number(usedRaw) || 0;

      if(givenId){
        const existing = q("SELECT id, sudah_dipakai FROM blocks WHERE id=?", [givenId]);
        if(existing.length > 0){
          // ID sudah ada -> update entri itu. sudah_dipakai ikut dari file kalau kolomnya diisi,
          // kalau kosong dibiarkan sesuai nilai yang sudah ada di database (nggak ke-reset).
          const keepUsed = hasUsedCol ? usedVal : existing[0].sudah_dipakai;
          run(`UPDATE blocks SET blok=?, teks=?, subtipe=?, fase_cocok=?, level_emosi=?, nada=?, kosakata_brand=?, cocok_dipasang_dengan=?, sudah_dipakai=? WHERE id=?`,
            [blok, teks, subtipe, fase, level, nada, brand, cocok, keepUsed, givenId]);
          updated++;
          return;
        }
        // ID diisi tapi belum ada di database -> buat baru dengan ID itu
        run(`INSERT INTO blocks (id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai)
             VALUES (?,?,?,?,?,?,?,?,?,?)`,
          [givenId, blok, teks, subtipe, fase, level, nada, brand, cocok, hasUsedCol ? usedVal : 0]);
        created++;
        return;
      }
      // ID kosong -> entri baru, ID dibuat otomatis
      const newId = nextId(blok);
      run(`INSERT INTO blocks (id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai)
           VALUES (?,?,?,?,?,?,?,?,?,?)`,
        [newId, blok, teks, subtipe, fase, level, nada, brand, cocok, hasUsedCol ? usedVal : 0]);
      created++;
    });
    statusEl.style.color = skipped > 0 ? 'var(--danger)' : 'var(--ok)';
    statusEl.innerHTML = `${created} entri baru, ${updated} entri diupdate.` +
      (skipped > 0 ? `<br>${skipped} baris dilewati:<br>` + skipReasons.slice(0,10).map(escapeHtml).join('<br>') + (skipReasons.length>10 ? `<br>...dan ${skipReasons.length-10} lainnya` : '') : '');
    if(afterImport) afterImport();
  };

  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'csv'){
    Papa.parse(file, {
      header: true, skipEmptyLines: true,
      complete: (results) => processRows(results.data),
      error: (err) => { statusEl.textContent = 'Gagal membaca CSV: ' + err.message; statusEl.style.color='var(--danger)'; }
    });
  } else {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const wb = XLSX.read(evt.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        processRows(rows);
      }catch(err){
        statusEl.textContent = 'Gagal membaca Excel: ' + err.message;
        statusEl.style.color = 'var(--danger)';
      }
    };
    reader.readAsArrayBuffer(file);
  }
}
  document.getElementById('file-import-csv').onchange = (e) => {
    importBlocksFromFile(e.target.files[0], document.getElementById('import-status'), renderDb);
  };
  const importTableInput = document.getElementById('file-import-table');
  if(importTableInput){
    importTableInput.onchange = (e) => {
      importBlocksFromFile(e.target.files[0], document.getElementById('import-table-status'), renderDb);
    };
  }
  panel.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const delId = parseInt(btn.dataset.del, 10);
      run("DELETE FROM blocks WHERE id=?", [btn.dataset.del]);
      dbSelectedIds.delete(delId);
      renderDb();
    };
  });
  panel.querySelectorAll('[data-copy]').forEach(btn => {
    btn.onclick = async () => {
      const row = q("SELECT teks FROM blocks WHERE id=?", [btn.dataset.copy]);
      if(row.length===0) return;
      try{
        await navigator.clipboard.writeText(row[0].teks);
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = row[0].teks; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{ document.execCommand('copy'); }catch(e2){}
        document.body.removeChild(ta);
      }
      const original = btn.textContent;
      btn.textContent = 'Tersalin';
      setTimeout(()=>{ btn.textContent = original; }, 1500);
    };
  });
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function ensureEmosiOverride(seq, lo, hi){
  if(rakitEmosiOverrideFase !== currentFase || rakitEmosiOverride.length !== seq.length){
    rakitEmosiOverride = seq.map(() => ({lo, hi: 10}));
    rakitSubtipeOverride = seq.map(() => '');
    rakitEmosiOverrideFase = currentFase;
  }
  if(rakitSubtipeOverride.length !== seq.length){
    rakitSubtipeOverride = seq.map(() => '');
  }
}

function getSubtipesForBlok(blokKey){
  const rows = q("SELECT DISTINCT subtipe FROM blocks WHERE blok=? AND subtipe IS NOT NULL AND subtipe != '' ORDER BY subtipe", [blokKey]);
  return rows.map(r => r.subtipe);
}

const S_FLOW_FASE_MAP = {
  "s1_dicariin_duluan": ["S1 — Kamu yang dicariin duluan (Fase 6,7,8)","7","8"],
  "s2_avoidant_npd": ["S2 — Dia avoidant dia NPD (Fase 10)"],
  "s3_dingin_bersimpuh": ["S3 — Dingin jadi bersimpuh (Fase 6,7,8)","7","8"],
  "s4_bersujud_sihir_putih": [],
  "s5_menang_kehilangan": ["S5 — Dia yang menang jadi kehilangan (Fase 7,8)","8"],
  "s6_sayang_karena_uang": ["S6 — Sayang cuma kalau ada uangnya (Fase 10)"],
  "s7_vc_pepet_gebetan": ["S7 — VC pepet gebetan / narasi (Fase 6)"],
};

function resolveFaseFilter(faseKey){
  // For S-flows, return mapped fase values for SQL filter
  const mapped = S_FLOW_FASE_MAP[faseKey];
  if(mapped && mapped.length > 0){
    // Build: (fase_cocok='Universal' OR fase_cocok='6' OR fase_cocok='7' OR fase_cocok='8')
    const parts = ["fase_cocok='Universal'", ...mapped.map(f => `fase_cocok='${f}'`)];
    return `(${parts.join(' OR ')})`;
  }
  if(mapped && mapped.length === 0){
    // Universal only (S4)
    return null;
  }
  // Non-S builtin flows: use faseKey directly
  return null;
}

function pickEntry(blokKey, faseKey, lo, hi, excludeId, subtipeFilter){
  const isBuiltinFase = !!FLOWS_DEF[faseKey];
  const sFaseFilter = resolveFaseFilter(faseKey);
  const mlFilter = rakitMultilineOnly ? " AND teks LIKE '%' || CHAR(10) || '%'" : '';
  const tryQuery = (loB, hiB, withFaseFilter) => {
    let sql = `SELECT * FROM blocks WHERE blok=? AND level_emosi BETWEEN ? AND ?${mlFilter}`;
    const params = [blokKey, loB, hiB];
    if(subtipeFilter){
      sql += ` AND subtipe=?`;
      params.push(subtipeFilter);
    }
    if(withFaseFilter){
      if(sFaseFilter){
        sql += ` AND ${sFaseFilter}`;
      } else {
        sql += ` AND (fase_cocok='Universal' OR fase_cocok=?)`;
        params.push(faseKey);
      }
    }
    if(excludeId){ sql += ` AND id != ?`; params.push(excludeId); }
    return q(sql, params);
  };
  let rows = [];
  if(isBuiltinFase) rows = tryQuery(lo, hi, true);
  if(rows.length===0) rows = tryQuery(lo, hi, false);
  if(rows.length===0) rows = tryQuery(Math.max(1,lo-1), Math.min(10,hi+1), false);
  if(rows.length===0) rows = tryQuery(Math.max(1,lo-2), Math.min(10,hi+2), false);
  if(rows.length===0){
    let fallbackSql = `SELECT * FROM blocks WHERE blok=?${excludeId?' AND id != ?':''}`;
    rows = q(fallbackSql, excludeId?[blokKey,excludeId]:[blokKey]);
  }
  if(rows.length===0) return null;
  rows.sort((a,b)=>(a.sudah_dipakai||0)-(b.sudah_dipakai||0));
  const minUsed = rows[0].sudah_dipakai||0;
  const lowest = rows.filter(r=>(r.sudah_dipakai||0)===minUsed);
  return lowest[Math.floor(Math.random()*lowest.length)];
}

function computeSignature(assembled){
  return assembled
    .filter(p => p.entry && p.entry.id)
    .map(p => p.entry.id)
    .sort()
    .join(',');
}

function checkDuplicateSignature(signature){
  if(!signature) return null;
  const rows = q("SELECT id, created_at FROM script_log WHERE signature=? ORDER BY id DESC LIMIT 1", [signature]);
  return rows.length ? rows[0] : null;
}

let duplicateWarning = null;

function pickEntryMultiline(blokKey, faseKey, lo, hi, subtipeFilter, minLines){
  const isBuiltinFase = !!FLOWS_DEF[faseKey];
  const sFaseFilter = resolveFaseFilter(faseKey);
  const mlFilter = rakitMultilineOnly ? " AND teks LIKE '%' || CHAR(10) || '%'" : '';
  const tryQuery = (loB, hiB, withFaseFilter) => {
    let sql = `SELECT * FROM blocks WHERE blok=? AND level_emosi BETWEEN ? AND ?${mlFilter}`;
    const params = [blokKey, loB, hiB];
    if(subtipeFilter){ sql += ` AND subtipe=?`; params.push(subtipeFilter); }
    if(withFaseFilter){
      if(sFaseFilter){
        sql += ` AND ${sFaseFilter}`;
      } else {
        sql += ` AND (fase_cocok='Universal' OR fase_cocok=?)`;
        params.push(faseKey);
      }
    }
    return q(sql, params);
  };
  let rows = [];
  if(isBuiltinFase) rows = tryQuery(lo, hi, true);
  if(rows.length===0) rows = tryQuery(lo, hi, false);
  if(rows.length===0) rows = tryQuery(Math.max(1,lo-1), Math.min(10,hi+1), false);
  if(rows.length===0) rows = tryQuery(Math.max(1,lo-2), Math.min(10,hi+2), false);
  if(rows.length===0){
    let fallbackSql = `SELECT * FROM blocks WHERE blok=?`;
    rows = q(fallbackSql, [blokKey]);
  }
  if(rows.length===0) return null;
  const withEnoughLines = rows.filter(r => {
    const lineCount = r.teks.split('\n').filter(l => l.trim()).length;
    return lineCount >= minLines;
  });
  const pool = withEnoughLines.length > 0 ? withEnoughLines : rows;
  pool.sort((a,b)=>(a.sudah_dipakai||0)-(b.sudah_dipakai||0));
  const minUsed = pool[0].sudah_dipakai||0;
  const lowest = pool.filter(r=>(r.sudah_dipakai||0)===minUsed);
  return lowest[Math.floor(Math.random()*lowest.length)];
}

function doRakit(){
  const [label, lo, hi, seq] = getFlowDef(currentFase);
  ensureEmosiOverride(seq, lo, hi);
  lastAssembled = [];
  let i = 0;
  while(i < seq.length){
    const blokKey = seq[i];
    const ov = rakitEmosiOverride[i] || {lo, hi};
    const sub = rakitSubtipeOverride[i] || '';

    if(blokKey === 'manual'){
      lastAssembled.push({blokKey, entry: { id: null, teks: '', subtipe: '', fase_cocok: currentFase, level_emosi: 5, nada: '', kosakata_brand: '', draft: true }, emosiLo: ov.lo, emosiHi: ov.hi, subtipeFilter: sub});
      i++;
      continue;
    }

    // Count consecutive same-type blocks
    let runLen = 1;
    while(i + runLen < seq.length && seq[i + runLen] === blokKey) runLen++;

    if(runLen === 1){
      // Single block — normal pick
      lastAssembled.push({blokKey, entry: pickEntry(blokKey, currentFase, ov.lo, ov.hi, null, sub), emosiLo: ov.lo, emosiHi: ov.hi, subtipeFilter: sub});
      i++;
    } else {
      // Consecutive group — pick ONE entry that has >= runLen lines, split by lines
      const entry = pickEntryMultiline(blokKey, currentFase, ov.lo, ov.hi, sub, runLen);
      if(entry){
        const lines = entry.teks.split('\n').filter(l => l.trim());
        for(let j = 0; j < runLen; j++){
          const ovJ = rakitEmosiOverride[i+j] || {lo, hi};
          const subJ = rakitSubtipeOverride[i+j] || '';
          const txt = j < lines.length ? lines[j] : '';
          lastAssembled.push({blokKey, entry: {...entry, teks: txt, _groupParent: entry.id, _groupPart: j+1, _groupTotal: runLen}, emosiLo: ovJ.lo, emosiHi: ovJ.hi, subtipeFilter: subJ});
        }
      } else {
        for(let j = 0; j < runLen; j++){
          const ovJ = rakitEmosiOverride[i+j] || {lo, hi};
          lastAssembled.push({blokKey, entry: null, emosiLo: ovJ.lo, emosiHi: ovJ.hi, subtipeFilter: ''});
        }
      }
      i += runLen;
    }
  }
  qcChecked = {};
  manualPickerOpenAt = null;
  const sig = computeSignature(lastAssembled);
  const dup = checkDuplicateSignature(sig);
  duplicateWarning = dup ? dup.created_at : null;
  renderRakit();
}

let manualPickerOpenAt = null;

function regenBlock(idx){
  const p = lastAssembled[idx];
  if(!p || p.blokKey === 'manual') return;
  const [, lo, hi] = getFlowDef(currentFase);
  const emosiLo = p.emosiLo !== undefined ? p.emosiLo : lo;
  const emosiHi = p.emosiHi !== undefined ? p.emosiHi : hi;
  const excludeId = p.entry ? p.entry.id : null;
  const sub = p.subtipeFilter || '';
  const newEntry = pickEntry(p.blokKey, currentFase, emosiLo, emosiHi, excludeId, sub);
  if(newEntry){
    lastAssembled[idx].entry = newEntry;
    lastAssembled[idx].emosiLo = emosiLo;
    lastAssembled[idx].emosiHi = emosiHi;
  }
  showHasilRakit();
}

function insertManualBlockBlank(afterIdx){
  const draft = {
    blokKey: 'manual',
    entry: { id: null, teks: '', subtipe: '', fase_cocok: currentFase, level_emosi: 5, nada: '', kosakata_brand: '', draft: true }
  };
  lastAssembled.splice(afterIdx + 1, 0, draft);
  manualPickerOpenAt = null;
  renderRakit();
}

function insertManualBlockExisting(afterIdx, existingId){
  const rows = q("SELECT * FROM blocks WHERE id=?", [existingId]);
  if(rows.length === 0) return;
  const row = rows[0];
  lastAssembled.splice(afterIdx + 1, 0, {
    blokKey: 'manual',
    entry: { id: row.id, teks: row.teks, subtipe: row.subtipe, fase_cocok: row.fase_cocok, level_emosi: row.level_emosi, nada: row.nada, kosakata_brand: row.kosakata_brand, draft: false }
  });
  manualPickerOpenAt = null;
  renderRakit();
}

function manualBlockNumber(idx){
  let count = 0;
  for(let i=0; i<=idx; i++){
    if(lastAssembled[i].blokKey === 'manual') count++;
  }
  return count;
}

    const isOpen = manualPickerOpenAt === idx;

      <div style="text-align:center;">
        <button class="small secondary" data-toggle-picker="${idx}"><i class="ti ti-plus" style="margin-right:4px;"></i>Tambah blok manual di sini</button>
      </div>`;
    if(isOpen){
      html += `<div class="card" style="margin-top:6px; padding:12px 14px;">
        <button class="small" data-insert-blank="${idx}" style="width:100%; margin-bottom:8px;">+ Buat blok manual baru (kosong)</button>
        ${savedManualBlocks.length === 0
          ? `<p class="hint" style="margin:0;">Belum ada blok manual tersimpan sebelumnya.</p>`
          : `<p class="hint" style="margin:0 0 6px;">Atau pakai lagi blok manual yang udah pernah kamu simpan:</p>
             ${savedManualBlocks.map(m => `
               <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line);">
                 <span style="font-size:12px; color:var(--text-dim); flex:1;">${escapeHtml(m.teks.slice(0,70))}${m.teks.length>70?'...':''}</span>
                 <button class="small secondary" data-insert-existing="${idx}" data-existing-id="${m.id}">Pakai ini</button>
               </div>`).join('')}`}
      </div>`;
    }
    html += `</div>`;
    return html;
  };

  let blocksHtml = insertBtn(-1);
  blocksHtml += lastAssembled.map((p, idx) => {
    let blockHtml;
    if(p.blokKey === 'manual'){
      if(!p.entry) p.entry = { id: null, teks: '', subtipe: '', fase_cocok: currentFase, level_emosi: 5, nada: '', kosakata_brand: '', draft: true };
      const manNum = manualBlockNumber(idx);
      const isDraft = p.entry.draft;
      blockHtml = `<div class="script-block" style="border-left-color:var(--gold);" data-block-idx="${idx}">
        <div class="lbl">Blok manual ${manNum}${p.entry.id ? ' · '+p.entry.id : ' (belum disimpan)'}</div>
        <textarea class="edit-teks" data-idx="${idx}" placeholder="Tulis isi blok manual kamu di sini..." style="min-height:70px; font-family:inherit; font-size:14px; line-height:1.6;">${escapeHtml(p.entry.teks)}</textarea>
        <div style="margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          ${isDraft
            ? `<button class="small secondary" data-save-manual-new="${idx}">Simpan ke database</button>`
            : `<button class="small secondary" data-save-update="${idx}">Update entri ${p.entry.id}</button>`}
          <button class="small secondary" data-remove-manual="${idx}" style="color:var(--danger);">Hapus blok ini</button>
          <span class="save-status" data-status="${idx}" style="font-size:11px; color:var(--ok);"></span>
        </div>
      </div>`;
    } else {
      const b = BLOKS.find(x=>x.key===p.blokKey);
      if(!p.entry){
        blockHtml = `<div class="script-block" style="border-left-color:var(--danger);"><div class="lbl">${b.label}</div><div class="txt" style="color:var(--text-faint);">Belum ada data yang cocok — isi database dulu.</div>
          <div style="margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <span style="font-size:11px; color:var(--text-faint);">Emosi</span>
            <input type="number" class="regen-lo" data-ridx="${idx}" min="1" max="10" value="${p.emosiLo||1}" style="width:44px; padding:3px 5px; margin:0; font-size:12px;">
            <span style="font-size:11px; color:var(--text-faint);">–</span>
            <input type="number" class="regen-hi" data-ridx="${idx}" min="1" max="10" value="${p.emosiHi||10}" style="width:44px; padding:3px 5px; margin:0; font-size:12px;">
            <button class="small secondary" data-regen="${idx}">↻ Coba generate lagi</button>
          </div>
        </div>`;
      } else {
        const subtipesForBlock = getSubtipesForBlok(p.blokKey);
        const curSubFilter = p.subtipeFilter || '';
        blockHtml = `<div class="script-block" data-block-idx="${idx}">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; flex-wrap:wrap;">
            <div class="lbl" style="margin:0;">${b.label} · ${p.entry.id}${p.entry.subtipe?' · '+escapeHtml(p.entry.subtipe):''}</div>
            <div style="display:flex; align-items:center; gap:5px; flex-shrink:0; flex-wrap:wrap;">
              ${subtipesForBlock.length > 0 ? `<select class="regen-sub" data-ridx="${idx}" style="font-size:11px; padding:3px 4px; max-width:120px;">
                <option value="">Semua</option>
                ${subtipesForBlock.map(st=>`<option value="${st}" ${st===curSubFilter?'selected':''}>${st}</option>`).join('')}
              </select>` : ''}
              <span style="font-size:11px; color:var(--text-faint);">Emosi</span>
              <input type="number" class="regen-lo" data-ridx="${idx}" min="1" max="10" value="${p.emosiLo||p.entry.level_emosi}" style="width:44px; padding:3px 5px; margin:0; font-size:12px;">
              <span style="font-size:11px; color:var(--text-faint);">–</span>
              <input type="number" class="regen-hi" data-ridx="${idx}" min="1" max="10" value="${p.emosiHi||p.entry.level_emosi}" style="width:44px; padding:3px 5px; margin:0; font-size:12px;">
              <button class="small secondary" data-regen="${idx}" title="Generate ulang blok ini" style="white-space:nowrap;">↻ Generate ulang</button>
            </div>
          </div>
          <textarea class="edit-teks" data-idx="${idx}" style="min-height:70px; font-family:inherit; font-size:14px; line-height:1.6;">${escapeHtml(p.entry.teks)}</textarea>
          <div class="meta">Emosi ${p.entry.level_emosi} · ${p.entry.nada||'-'}${p.entry.kosakata_brand?' · '+p.entry.kosakata_brand:''}</div>
          <div style="margin-top:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <button class="small secondary" data-save-update="${idx}">Update entri ${p.entry.id}</button>
            <button class="small secondary" data-save-new="${idx}">Simpan sebagai entri baru</button>
            <span class="save-status" data-status="${idx}" style="font-size:11px; color:var(--ok);"></span>
          </div>
        </div>`;
      }
    }
    return blockHtml + insertBtn(idx);
  }).join('');

  div.innerHTML = `<div class="card"><h3 style="font-size:14px; margin:0 0 4px;">${label}</h3>
    <p class="hint" style="margin:0 0 12px;">Edit langsung tiap blok, atau selipkan blok manual di posisi manapun buat konten yang kamu tulis sendiri.</p>
    ${duplicateWarning ? `<div class="status-msg warn" style="margin-bottom:12px;"><i class="ti ti-alert-triangle" style="margin-right:4px;"></i>Kombinasi blok ini persis sama dengan script yang pernah kamu tandai dipakai pada ${new Date(duplicateWarning).toLocaleString('id-ID')}. Klik "Rakit ulang" kalau mau kombinasi lain.</div>` : ''}
    ${blocksHtml}
    <button id="btn-copy">Copy script</button>
    <button id="btn-tandai" class="secondary">Tandai semua sudah dipakai</button>
    <span id="copy-status" style="font-size:12px; color:var(--ok); margin-left:8px;"></span>
  </div>`;

  document.getElementById('btn-tandai').onclick = () => {
    const scriptText = Array.from(div.querySelectorAll('.edit-teks')).map(ta => ta.value).filter(t=>t.trim()).join('\n\n');
    const sig = computeSignature(lastAssembled);
    lastAssembled.forEach(p => {
      if(p.entry && p.entry.id) run("UPDATE blocks SET sudah_dipakai = sudah_dipakai + 1 WHERE id=?", [p.entry.id]);
    });
    run("INSERT INTO script_log (fase_key, signature, script_text, created_at) VALUES (?,?,?,?)",
      [currentFase, sig, scriptText, new Date().toISOString()]);
    duplicateWarning = null;
    renderRakit();
  };
  document.getElementById('btn-copy').onclick = async () => {
    const text = Array.from(div.querySelectorAll('.edit-teks')).map(ta => ta.value).filter(t=>t.trim()).join('\n\n');
    const statusEl = document.getElementById('copy-status');
    try{
      await navigator.clipboard.writeText(text);
      statusEl.textContent = 'Tersalin ke clipboard';
    }catch(e){
      const ta2 = document.createElement('textarea');
      ta2.value = text; ta2.style.position = 'fixed'; ta2.style.opacity = '0';
      document.body.appendChild(ta2); ta2.focus(); ta2.select();
      try{ document.execCommand('copy'); statusEl.textContent = 'Tersalin ke clipboard'; }
      catch(e2){ statusEl.textContent = 'Gagal menyalin, coba manual'; }
      document.body.removeChild(ta2);
    }
    setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 3000);
  };

  div.querySelectorAll('[data-regen]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.regen);
      const loInput = div.querySelector(`.regen-lo[data-ridx="${idx}"]`);
      const hiInput = div.querySelector(`.regen-hi[data-ridx="${idx}"]`);
      const subSel = div.querySelector(`.regen-sub[data-ridx="${idx}"]`);
      if(loInput && hiInput){
        let lo = Math.max(1, Math.min(10, parseInt(loInput.value,10)||1));
        let hi = Math.max(1, Math.min(10, parseInt(hiInput.value,10)||10));
        if(lo > hi){ const t=lo; lo=hi; hi=t; }
        lastAssembled[idx].emosiLo = lo;
        lastAssembled[idx].emosiHi = hi;
      }
      if(subSel){
        lastAssembled[idx].subtipeFilter = subSel.value;
      }
      btn.textContent = '...';
      btn.disabled = true;
      regenBlock(idx);
    };
  });

  div.querySelectorAll('[data-toggle-picker]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.togglePicker);
      manualPickerOpenAt = (manualPickerOpenAt === idx) ? null : idx;
      showHasilRakit();
    };
  });
  div.querySelectorAll('[data-insert-blank]').forEach(btn => {
    btn.onclick = () => insertManualBlockBlank(Number(btn.dataset.insertBlank));
  });
  div.querySelectorAll('[data-insert-existing]').forEach(btn => {
    btn.onclick = () => insertManualBlockExisting(Number(btn.dataset.insertExisting), btn.dataset.existingId);
  });
  div.querySelectorAll('[data-remove-manual]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.removeManual);
      lastAssembled.splice(idx, 1);
      renderRakit();
    };
  });
  div.querySelectorAll('[data-save-update]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.saveUpdate);
      const p = lastAssembled[idx];
      const textarea = div.querySelector(`.edit-teks[data-idx="${idx}"]`);
      const newText = textarea.value.trim();
      if(!newText || !p.entry || !p.entry.id) return;
      run("UPDATE blocks SET teks=? WHERE id=?", [newText, p.entry.id]);
      p.entry.teks = newText;
      const statusEl = div.querySelector(`.save-status[data-status="${idx}"]`);
      statusEl.textContent = `Tersimpan ke ${p.entry.id}`;
      setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2500);
    };
  });
  div.querySelectorAll('[data-save-new]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.saveNew);
      const p = lastAssembled[idx];
      const textarea = div.querySelector(`.edit-teks[data-idx="${idx}"]`);
      const newText = textarea.value.trim();
      if(!newText || !p.entry) return;
      const newId = nextId(p.blokKey);
      run(`INSERT INTO blocks (id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai)
           VALUES (?,?,?,?,?,?,?,?,?,0)`,
        [newId, p.blokKey, newText, p.entry.subtipe, p.entry.fase_cocok, p.entry.level_emosi, p.entry.nada, p.entry.kosakata_brand, '']);
      const statusEl = div.querySelector(`.save-status[data-status="${idx}"]`);
      statusEl.textContent = `Tersimpan sebagai ${newId} baru`;
      setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2500);
    };
  });
  div.querySelectorAll('[data-save-manual-new]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.saveManualNew);
      const p = lastAssembled[idx];
      const textarea = div.querySelector(`.edit-teks[data-idx="${idx}"]`);
      const newText = textarea.value.trim();
      if(!newText) return;
      const newId = nextId('manual');
      run(`INSERT INTO blocks (id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai)
           VALUES (?,?,?,?,?,?,?,?,?,0)`,
        [newId, 'manual', newText, '', currentFase, 5, '', '', '']);
      p.entry = { id: newId, teks: newText, subtipe: '', fase_cocok: currentFase, level_emosi: 5, nada: '', kosakata_brand: '', draft: false };
      renderRakit();
    };
  });
}

    <h3 style="font-size:14px; margin:22px 0 6px;">Ekspor / impor Excel (format sama)</h3>
    <p style="font-size:13px; color:var(--text-dim);">Satu sheet, satu format, buat dua arah. Unduh, edit di Excel/Google Sheets (ubah teks yang sudah ada, tambah baris baru dengan kolom id dikosongkan), lalu import ulang file yang sama lewat tab Database — nggak perlu ubah struktur apapun.</p>
    <button id="btn-export-xlsx">Unduh sebagai .xlsx</button>

    <h3 style="font-size:14px; margin:22px 0 6px;">Ganti database</h3>
    <p style="font-size:13px; color:var(--text-dim);">Kalau kamu sudah edit file-nya di DBeaver dan mau bawa perubahan itu balik ke sini, upload ulang di bawah ini (akan menimpa data yang sedang aktif di tool).</p>
    <input type="file" id="file-input-2" accept=".sqlite,.db">
  </div>`;
  document.getElementById('btn-download').onclick = () => {
    const bytes = db.export();
    const blob = new Blob([bytes], {type:'application/x-sqlite3'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'script_assembler.sqlite';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('btn-export-xlsx').onclick = () => {
    const cols = ["id","blok","teks","subtipe","fase_cocok","level_emosi","nada","kosakata_brand","cocok_dipasang_dengan","sudah_dipakai"];
    const allRows = q("SELECT id, blok, teks, subtipe, fase_cocok, level_emosi, nada, kosakata_brand, cocok_dipasang_dengan, sudah_dipakai FROM blocks ORDER BY blok, id");
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(allRows, { header: cols });
    ws['!cols'] = [{wch:10},{wch:14},{wch:55},{wch:20},{wch:12},{wch:10},{wch:14},{wch:20},{wch:20},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws, "Data");
    XLSX.writeFile(wb, 'script_assembler_export.xlsx');
  };
  document.getElementById('file-input-2').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const buf = await file.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));
    migrateSchema();
    persist();
    renderTab('db');
  };
}

initEngine();
</script>
</body>
</html>
